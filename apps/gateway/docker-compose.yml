version: '3.8'

services:
  autopilot-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autopilot-gateway
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      - PORT=443
      - AUTOPILOT_HUB_URL=http://hub:8787
    networks:
      - autopilot-net

networks:
  autopilot-net:
    driver: bridge
